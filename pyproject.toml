[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-perplexity-adapter"
version = "0.1.5"
description = "Standalone Responses API adapter for running Codex through Perplexity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Andrew Portuguese"}]
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "uvicorn==0.53.0",
]

[project.urls]
Homepage = "https://github.com/FredHutch/codex-perplexity-adapter"
Repository = "https://github.com/FredHutch/codex-perplexity-adapter"
Issues = "https://github.com/FredHutch/codex-perplexity-adapter/issues"
Releases = "https://github.com/FredHutch/codex-perplexity-adapter/releases"

[project.scripts]
codex-perplexity-adapter = "codex_perplexity_adapter.cli:main"

[tool.setuptools.packages.find]
include = ["codex_perplexity_adapter*"]
